{% for e in form.non_field_errors %}<p class="err">{{ e }}</p>{% endfor %}
{% for f in form %}{% if f.field.widget.input_type == 'checkbox' %}<label class="check">{{ f }}<span>{{ f.label }}</span></label>{% else %}<div class="field"><label for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}{% if f.help_text %}<small class="muted">{{ f.help_text }}</small>{% endif %}{% for e in f.errors %}<p class="err">{{ e }}</p>{% endfor %}</div>{% endif %}{% endfor %}
